name: Tests

on: push

jobs:
  # El nombre del job es launch-test
  launch-tests:
    runs-on: ubuntu-latest
    container: eclipse-temurin:8-jdk
    steps:
      # Hacemos un checkout del código del repositorio
      - uses: actions/checkout@v2
      # Y lanzamos los tests
      - name: Developer tests
        run: ./mvnw test
