<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head (titulo)">
    <meta charset="UTF-8"/>
    <title th:text="${titulo}"></title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark">
    <a class="navbar-brand" href="/">ToDoList</a>
    <div id="navbarPrincipal" class="ml-auto">
        <ul class="navbar-nav ml-auto d-flex flex-row">
            <li class="nav-item p-2">
                <a class="nav-link" href="/about">ToDoList</a>
            </li>
            <li class="nav-item p-2" th:if="${session.idUsuarioLogeado != null}">
                <a class="nav-link" th:href="@{/usuarios/{id}/tareas(id=${session.idUsuarioLogeado})}">Tareas</a>
            </li>
            <li class="nav-item dropdown p-2" th:if="${session.idUsuarioLogeado != null}">
                <a class="nav-link dropdown-toggle" href="#" id="cuentaDropdown" role="button" data-toggle="dropdown" aria-expanded="false">
                    Cuenta
                    <span th:if="${usuarioLogeado?.nombre}" th:text="' (' + ${usuarioLogeado.nombre} + ')'"></span>
                </a>
                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="cuentaDropdown">
                    <li>
                        <a class="dropdown-item" th:href="@{/logout}">Cerrar sesión</a>
                    </li>
                </ul>
            </li>
        </ul>
    </div>
</nav>

<div th:fragment="javascript">
    <script th:src="@{/js/jquery.min.js}"></script>
    <script th:src="@{/js/popper.min.js}"></script>
    <script th:src="@{/js/bootstrap.min.js}"></script>
</div>

</html>
