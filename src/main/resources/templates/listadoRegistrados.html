<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments :: head (titulo='Acerca de')"></head>

<body>

<div th:replace="fragments :: navbar"></div>

<div class="container-fluid">
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Identificador</th>
                <th>Correo electrónico</th>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Acción</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="usuario : ${usuarios}">
                <td th:text="${usuario.id}"></td>
                <td th:text="${usuario.email}"></td>
                <td th:text="${usuario.nombre}"></td>
                <td><a th:href="@{/registrados/{id}(id=${usuario.id})}">Descripción</a></td>
                <td>
                    <form th:action="@{/registrados/{id}/bloquear(id=${usuario.id})}" method="post" style="display:inline;">
                        <button type="submit" class="btn btn-sm" th:classappend="${usuario.bloqueado} ? 'btn-success' : 'btn-danger'"
                                th:text="${usuario.bloqueado} ? 'Desbloquear' : 'Bloquear'"></button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</div>

<div th:replace="fragments::javascript"/>

</body>
</html>
