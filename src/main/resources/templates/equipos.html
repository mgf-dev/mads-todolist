<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments :: head (titulo='Equipos')"></head>

<body>

<div th:replace="fragments :: navbar"></div>

<div class="container-fluid">
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Identificador</th>
                <th>Nombre del equipo</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="equipo : ${equipos}">
                <td th:text="${equipo.id}"></td>
                <td><a th:text="${equipo.nombre}" th:href="@{/equipos/{id}(id=${equipo.id})}"></a></td>
                <td>
                    <form th:if="${equiposUsuario == null or !equiposUsuario.contains(equipo)}"
                          th:action="@{/equipos/{id}/unirse(id=${equipo.id})}" method="post" style="display:inline;">
                        <button type="submit" class="btn btn-sm" th:text='Unirse'></button>
                    </form>

                    <form th:if="${equiposUsuario != null and equiposUsuario.contains(equipo)}"
                          th:action="@{/equipos/{id}/salir(id=${equipo.id})}" method="post" style="display:inline;">
                        <button type="submit" class="btn btn-sm" th:text='Salir'></button>
                    </form>
                </td>
                <td>
                    <form method="post" th:if="${esAdmin}" th:action="@{/equipos/{id}/eliminar(id=${equipo.id})}">
                        <button type="submit">Eliminar</button>
                    </form>
                    <a th:href="@{/equipos/{id}/cambiarNombre(id=${equipo.id})}">Cambiar nombre</a>
                </td>
            </tr>
        </tbody>
    </table>
    <form method="post" th:action="@{/equipos/nuevo}" th:object="${equipoData}">
        <input type="text" placeholder="Nombre del equipo" th:field="*{nombre}" required/>
        <button>Crear un equipo</button>
    </form>
    
</div>

<div th:replace="fragments::javascript"/>

</body>
</html>
